[build]
  # Install dependencies in the `frontend` package and build the Vite app
  command = "npm --prefix frontend install && npm --prefix frontend run build"
  # Build output directory for Netlify
  publish = "frontend/dist"

[build.environment]
  # Use a supported Node version on Netlify (Vite requires 20.19.0+ or 22.12.0+)
  NODE_VERSION = "20.19.0"
  # Set your frontend API base URL for production (override on Netlify UI)
  # Replace the placeholder below with your real backend URL or set it in Netlify site settings
  VITE_API_URL = "https://api.example.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
